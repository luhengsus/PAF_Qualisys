<svg viewBox="0 0 960 280" xmlns="http://www.w3.org/2000/svg" style="font-family:'Segoe UI','Microsoft YaHei',sans-serif; font-size:13px;">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e3f2fd"/><stop offset="100%" stop-color="#bbdefb"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e8f5e9"/><stop offset="100%" stop-color="#c8e6c9"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff3e0"/><stop offset="100%" stop-color="#ffe0b2"/></linearGradient>
  </defs>

  <!-- QTM -->
  <rect x="10" y="40" width="180" height="70" rx="8" fill="url(#g1)" stroke="#1976d2" stroke-width="1.5"/>
  <text x="100" y="68" text-anchor="middle" font-weight="bold" fill="#0d47a1">QTM 采集</text>
  <text x="100" y="88" text-anchor="middle" font-size="11" fill="#555">Static*.c3d + Dynamic*.c3d</text>

  <!-- Arrow -->
  <line x1="190" y1="75" x2="240" y2="75" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- PAF -->
  <rect x="250" y="40" width="180" height="70" rx="8" fill="url(#g1)" stroke="#1976d2" stroke-width="1.5"/>
  <text x="340" y="68" text-anchor="middle" font-weight="bold" fill="#0d47a1">PAF 框架</text>
  <text x="340" y="88" text-anchor="middle" font-size="11" fill="#555">受试者信息 / 分析触发</text>

  <!-- Arrow -->
  <line x1="430" y1="75" x2="480" y2="75" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Visual3D -->
  <rect x="490" y="30" width="220" height="90" rx="8" fill="url(#g2)" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="600" y="58" text-anchor="middle" font-weight="bold" fill="#1b5e20">Visual3D Pipeline</text>
  <text x="600" y="76" text-anchor="middle" font-size="11" fill="#555">Create_Hybrid_Model</text>
  <text x="600" y="92" text-anchor="middle" font-size="11" fill="#555">Build / Compute / Export</text>
  <text x="600" y="108" text-anchor="middle" font-size="11" fill="#555">→ *_Result.cmz + DATA_*.txt</text>

  <!-- Arrow -->
  <line x1="710" y1="75" x2="760" y2="75" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Output -->
  <rect x="770" y="40" width="175" height="70" rx="8" fill="url(#g3)" stroke="#e65100" stroke-width="1.5"/>
  <text x="857" y="68" text-anchor="middle" font-weight="bold" fill="#bf360c">数据分析</text>
  <text x="857" y="88" text-anchor="middle" font-size="11" fill="#555">统计分析 / 报告</text>

  <!-- Phases below -->
  <rect x="10" y="140" width="935" height="120" rx="6" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
  <text x="30" y="165" font-weight="bold" fill="#333">Pipeline 处理阶段</text>

  <rect x="20" y="178" width="165" height="60" rx="4" fill="#e3f2fd" stroke="#90caf9"/>
  <text x="102" y="202" text-anchor="middle" font-size="12" fill="#0d47a1">Phase 1: 文件加载</text>
  <text x="102" y="220" text-anchor="middle" font-size="11" fill="#555">C3D 导入 + 标签</text>

  <line x1="185" y1="208" x2="210" y2="208" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="215" y="178" width="165" height="60" rx="4" fill="#e3f2fd" stroke="#90caf9"/>
  <text x="297" y="202" text-anchor="middle" font-size="12" fill="#0d47a1">Phase 2: 滤波</text>
  <text x="297" y="220" text-anchor="middle" font-size="11" fill="#555">插值 + Butterworth</text>

  <line x1="380" y1="208" x2="405" y2="208" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="410" y="178" width="165" height="60" rx="4" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="492" y="202" text-anchor="middle" font-size="12" fill="#1b5e20">Phase 3: 建模</text>
  <text x="492" y="220" text-anchor="middle" font-size="11" fill="#555">模型模板应用</text>

  <line x1="575" y1="208" x2="600" y2="208" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="605" y="178" width="165" height="60" rx="4" fill="#fff3e0" stroke="#ffcc80"/>
  <text x="687" y="202" text-anchor="middle" font-size="12" fill="#bf360c">Phase 4: 计算</text>
  <text x="687" y="220" text-anchor="middle" font-size="11" fill="#555">运动学 + 动力学</text>

  <line x1="770" y1="208" x2="795" y2="208" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="800" y="178" width="135" height="60" rx="4" fill="#f3e5f5" stroke="#ce93d8"/>
  <text x="867" y="202" text-anchor="middle" font-size="12" fill="#6a1b9a">Phase 5: 导出</text>
  <text x="867" y="220" text-anchor="middle" font-size="11" fill="#555">ASCII 文本</text>
</svg>
